<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection Counter</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
</head>

<body>
    <div class="container">
        <h1>Face Detection Counter</h1>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-button active" data-tab="live">Live Detection</button>
            <button class="tab-button" data-tab="history">Video History</button>
        </div>

        <!-- Live Detection Tab -->
        <div id="live-tab" class="tab-content active">
            <div class="camera-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>

            <div class="controls">
                <button id="startCamera" class="btn btn-primary">Bật Camera</button>
                <button id="stopCamera" class="btn btn-danger" disabled>Tắt Camera</button>
                <button id="startTracking" class="btn btn-success" disabled>Bắt đầu đếm</button>
                <button id="stopTracking" class="btn btn-warning" disabled>Kết thúc đếm</button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Khuôn mặt hiện tại</div>
                    <div id="currentFaces" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Tổng khuôn mặt đã xuất hiện</div>
                    <div id="totalFaces" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Thời gian đếm</div>
                    <div id="trackingTime" class="stat-value">0s</div>
                </div>
            </div>

            <div class="recording-status" id="recordingStatus">
                <span class="status-indicator"></span>
                <span>Đang ghi hình...</span>
            </div>
        </div>

        <!-- Video History Tab -->
        <div id="history-tab" class="tab-content">
            <div class="video-history">
                <!-- Danh sách video bên trái -->
                <div class="video-list">
                    <h3 class="video-list-header">Danh sách video đã lưu</h3>
                    <div class="video-list-content" id="videoList">
                        <!-- Video items will be loaded here -->
                    </div>
                </div>

                <!-- Video player bên phải -->
                <div class="video-player-container">
                    <h3 class="video-player-header">Video Player</h3>
                    <div class="video-player-content">
                        <video id="playbackVideo" controls>
                            Your browser does not support the video tag.
                        </video>
                        <div class="video-info" id="videoInfo">
                            <div class="no-video-selected">
                                <div class="icon">📹</div>
                                <div>
                                    <h4>Chưa có video được chọn</h4>
                                    <p>Vui lòng chọn một session từ danh sách bên trái để xem video và thông tin chi
                                        tiết.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/videoManager.js"></script>
    <script src="js/faceDetection.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
